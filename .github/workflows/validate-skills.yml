name: Validate shared skills

on:
  pull_request:
    paths:
      - "marketing/**"
      - "automation/**"
      - "scripts/**"
      - "tests/maintenance/**"
      - ".githooks/**"
      - ".github/workflows/validate-skills.yml"
      - "MAINTENANCE.md"
      - "README.md"
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run maintenance tests
        run: python3 -m unittest discover -s tests/maintenance -v
      - name: Validate repository and CMS source
        run: scripts/skills-doctor --repo . --bootstrap-cms

  macos-maintenance-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run macOS maintenance tests
        run: python3 -m unittest discover -s tests/maintenance -v
