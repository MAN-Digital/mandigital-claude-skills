# TEMPLATE — copy this folder to campaigns/<slug>/, fill every <>, delete this line.
slug: <kebab-case-id> # must match folder name
name: <Human-readable name>
status: setup
objective: >
  <What this campaign achieves and what it is NOT.>

intake: intake.yaml # complete required questions before list/provider work

streams: [] # optional; add streams/<name>/stream.yaml per stream (see revenue-context)

audience:
  # WHO this campaign is written for, as a grounded buying-committee seat.
  # `persona_id` is a folder under references/Synthetic Audiences/personas/;
  # `overlay` is the trigger scenario A-F the copy is built around (A forecast
  # mistrust · B multi-market fragmentation · C quote-to-cash friction ·
  # D renewal/expansion blind spots · E HubSpot rebuild/migration ·
  # F "make AI useful" with unstable foundations).
  #
  # These are NOT optional decoration, but be precise about what reads them
  # TODAY. The wiring harness fails when a key is absent, and when a value is
  # non-empty it also checks the letter is A-F and the id names a real package.
  # The pre-send persona panel (ADVISORY — it never blocks) reads the binding
  # from `settings_json.campaign.persona_id` / `.overlay`; NOTHING copies this
  # audience block into settings_json yet — signal_processor builds that block
  # from the strategy JSON and emits `personas_used`, a list of job titles — so
  # until it does, the panel grades the simulator's OWN default seats and says
  # so in `summary.persona_panel.binding` and in a flag. Leave a value EMPTY
  # with a one-line reason while a persona is being grounded; never delete the
  # key.
  persona_id: "" # e.g. cro-vp-revenue
  overlay: "" # A-F
  personas: [] # legacy title/role list; still feeds the envelope's personas_used
  geography: []
  industries: []
  qualifiers: []

lists:
  source: { hubspot_list_id: "", note: READ-ONLY }
  curated: { rule: "", hubspot_folder_id: "", hubspot_list_id: "" }
  prospecting: { enabled: false, cadence: weekly, auto_add: false }

assets: {}

# TIME-BOXED campaigns (events, conferences, webinars, launches, seasonal
# pushes). Omit this block entirely for evergreen campaigns.
# Why it matters: an event campaign dies on its date — "see you at X" is
# worthless the day after, and a sequence still running past the event actively
# embarrasses us. The strategist must refuse to build or stage a cohort whose
# touches would land after `hard_stop`.
time_box:
  event_date: "" # YYYY-MM-DD, the day the thing happens
  outreach_opens: "" # earliest sensible touch (e.g. event_date - 30d)
  hard_stop: "" # NO touch may be scheduled after this (usually event_date - 1d)
  after_event: "" # what happens to non-responders: "post_event_followup" | "close"
  # Event angles already exist in the vocabulary and carry their own guard
  # rules (SKILL_GUARD §13): event_physical = casual, no pitch, the draw is the
  # ROOM not the product; event_coattend = reference their attendance from a
  # real public source and defer any pitch to the post-event follow-up.

signals: [trigify, graph_one, exa, linkup_search, linkup_social, albacross]

# Ask for CAPABILITIES, then select whichever configured provider can supply
# them. A missing optional provider is recorded and skipped. A missing required
# provider holds before external access. Candidate order is preference order.
provider_capabilities:
  crm.audience.read:
    required: true
    providers: [hubspot]
    on_unavailable: fail
  outreach.sequence.read:
    required: true
    providers: [woodpecker_api]
    on_unavailable: fail
  outreach.campaign.draft:
    required: true
    providers: [woodpecker_api]
    on_unavailable: fail
  outreach.prospects.write:
    required: true
    providers: [woodpecker_api]
    on_unavailable: fail
  linkedin.relationship.read:
    required: true
    providers: [snapshot_routes, linkup_social, openclaw_browser]
    on_unavailable: hold
  outreach.sequence.condition:
    required: true
    providers: [openclaw_browser]
    on_unavailable: hold
    api_attempt: woodpecker_api
    api_limitation: WCNF001_API_UNSUPPORTED_CAMPAIGN_FEATURES
  research.web_search:
    required: false
    providers: [exa, linkup_search, crawl4ai]
    on_unavailable: skip_with_evidence
  signals.intent.read:
    required: false
    providers: [trigify]
    on_unavailable: skip_with_evidence
  relationships.warm_path.read:
    required: false
    providers: [graph_one, hubspot_activity]
    on_unavailable: cold_route
  notification.thread.write:
    required: true
    providers: [openclaw_discord]
    on_unavailable: hold

provider_notes:
  # These are different companies/API families despite their similar names.
  linkup_search:
    api_family: linkup.so
    env: LINKUP_SEARCH_API_KEY
  linkup_social:
    api_family: linkupapi.com
    env: LINKUP_API_KEY+(LINKUP_ACCOUNT_ID|LINKUP_LOGIN_TOKEN)
    metering: invitation-status costs 1 credit per profile; require an explicit ceiling

execution:
  compiler: mission-control:scripts/prepare_outreach_campaign.py
  default_mode: plan # credential/runtime resolution only; zero provider reads/writes
  compile_flag: --compile # provider reads + local private artifact; zero staging
  staging: mission_control_build_approval # authenticated gate; never direct CLI
  activation_allowed: false # activation is a distinct, unavailable capability

autonomy_tiers: # keep the standard definitions unless Romeo changes them
  tier1: agent does all work; every send + reply approved in Discord
  tier2: auto-send QA-passed sequences within caps; replies human-approved
  tier3: auto-replies for safe classes; human for objections + ambiguity
  kill_switch: STOP-OUTREACH halts everything
  promotion_rule: Romeo-approved only, after >=2 weeks calibration

research:
  protocol: research-protocol.md # copy from revenue-context unless campaign needs a stricter one
  dossier_dir: dossiers/

routing: routing.md # required if streams > 1

reporting:
  daily_nudge: "08:30 Europe/Warsaw -> #business-development (thread)"
  weekly_report: "Mon 08:00 Europe/Warsaw -> #business-development (thread)"

messaging:
  regional_split: []
  ai_disclosure: undecided
  company_name: MAN Digital
  memes: # memelord skill — optional flavor, never default
    allowed: false # flip per campaign; even then: follow-ups only, never touch 1, never services-type streams, every meme individually human-approved

channels:
  email_mailboxes: all
  linkedin: both

booking:
  meeting_link: "" # shared ONLY after the person engages with a proposed time
  policy: propose 2-3 concrete slots in writing from calendar; NEVER any link in the first email (global hard rule)

mention_policy: >
  <Which file is the allowlist and the rule; no file -> no name-drops.>
